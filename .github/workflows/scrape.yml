name: Daily scrape

permissions:
  contents: write

on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: daily
        type: choice
        options:
          - daily
          - backfill
      league:
        description: 'Limit to one league key (e.g. zl, excr) — leave empty for all'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          LEAGUE="${{ github.event.inputs.league }}"
          ARGS=""
          if [ "$MODE" = "backfill" ]; then
            ARGS="--backfill"
          fi
          if [ -n "$LEAGUE" ]; then
            ARGS="$ARGS --league $LEAGUE"
          fi
          python orchestrator.py $ARGS

      - name: Commit updated config.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          # Only commit if there is something staged
          git diff --cached --quiet || git commit -m "chore: update config.json [skip ci]"

      - name: Push
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
