name: Daily scrape

on:
  schedule:
    # 04:23 UTC = 06:23 Prague (CEST) / 05:23 (CET).  Deliberately off the top
    # of the hour: GitHub queues scheduled jobs hardest at :00, so an odd minute
    # actually starts closer to its slot.  The job then sleeps a random 0–120
    # min before scraping, so the real start drifts across a ~2 h window.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: daily
        type: choice
        options:
          - daily
          - backfill
      league:
        description: 'Limit to one league key (e.g. zl, excr) — leave empty for all'
        required: false
        default: ''

env:
  # Upper bound of the random pre-scrape delay, in minutes (scheduled runs only).
  MAX_JITTER_MINUTES: 120

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only scheduled runs jitter — a manual dispatch should start immediately.
      - name: Random delay
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % (MAX_JITTER_MINUTES * 60) ))
          echo "Sleeping ${DELAY}s (~$(( DELAY / 60 )) min) before scraping."
          sleep "$DELAY"

      - name: Run orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          LEAGUE="${{ github.event.inputs.league }}"
          ARGS=""
          if [ "$MODE" = "backfill" ]; then
            ARGS="--backfill"
          fi
          if [ -n "$LEAGUE" ]; then
            ARGS="$ARGS --league $LEAGUE"
          fi
          python orchestrator.py $ARGS
